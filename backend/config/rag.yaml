# ============================================================
# EquiMind 模型后端配置
# ============================================================
# backend 可选值:
#   dashscope  - 阿里云 DashScope（云端 API，当前默认）
#   local      - 本地 vLLM 推理服务（需先启动 vLLM Chat + Embedding）
#   openai_compatible - 其他 OpenAI 兼容 API
#
# 模型切换指南：
#   本地 Qwen3-14B-AWQ (首选):  backend: local, chat_model_name: Qwen3-14B-AWQ
#   本地 Qwen3-8B (备选):      backend: local, chat_model_name: Qwen3-8B
#   本地 Qwen3-32B-AWQ (大):   backend: local, chat_model_name: Qwen3-32B-AWQ
#   云端 DeepSeek-V4:          backend: dashscope
#
#   切换步骤：
#     1. 修改 backend 值
#     2. 若 vLLM 模型路径变化，同步修改 vllm.yaml
#     3. 若 Embedding 模型变化，删除旧 ChromaDB 并重建向量库
# ============================================================

backend: local

# ------------------------------------------------------------
# 本地 vLLM 配置（backend: local 时生效）
# ------------------------------------------------------------
local:
  chat_model_name: Qwen3-14B-AWQ
  chat_api_base: http://localhost:8002/v1
  chat_api_key_env: not-needed        # vLLM 不需要真 key；_resolve_api_key 解析失败后当字面量使用

  # 可选：ChatOpenAI 额外参数（temperature, top_p 等）
  # chat_model_kwargs:
  #   temperature: 0.7
  #   top_p: 0.8

  embedding_model_name: /data/sqx/models/modelscope/models/BAAI--bge-m3/snapshots/master
  embedding_api_base: http://localhost:8003/v1
  embedding_api_key_env: not-needed
  embedding_provider: openai_compatible   # 走 OpenAI 兼容 API

  # Qwen3 本地模式使用精简提示词（main_prompt_qwen3.txt），
  # 仅描述实际注册的 7 个工具，避免模型调用不存在的工具。

# ------------------------------------------------------------
# DashScope 云端配置（backend: dashscope 时生效）
# ------------------------------------------------------------
dashscope:
  chat_model_name: deepseek-v4-pro
  chat_api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  chat_api_key_env: sk-154060ec71154f0584eb03205b827fd2
  enable_thinking: true

  embedding_model_name: text-embedding-v4
  embedding_provider: dashscope
  embedding_api_key_env: sk-4c1e9ba1d379434a8191e9c1accd5c5d

  # DashScope 使用完整提示词（main_prompt.txt），包含详细的领域能力描述。

# ------------------------------------------------------------
# Qwen3 备选模型参考（修改 local.chat_model_name 切换）
# ------------------------------------------------------------
# Qwen3-8B (FP16, ~16GB):
#   优势：原生 FP16 精度，工具调用可能更稳定
#   劣势：推理能力弱于 14B，显存占用大 ~16GB
#   模型 ID：Qwen/Qwen3-8B（HuggingFace）
#
# Qwen3-32B-AWQ (INT4, ~18GB):
#   优势：最强推理能力，工具调用最准
#   劣势：18GB + Embedding 2GB + KV 6GB = 26GB > 24GB，需调低 gpu_memory_utilization 到 0.75
#   模型 ID：Qwen/Qwen3-32B-AWQ（HuggingFace）
#
# Qwen2.5-14B-AWQ (备胎，若 Qwen3 不可用):
#   优势：工具调用成熟度可能更高（社区反馈多）
#   劣势：无原生 thinking 模式
#   模型 ID：Qwen/Qwen2.5-14B-Instruct-AWQ（HuggingFace）
